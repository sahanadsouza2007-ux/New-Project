<!DOCTYPE html>
<html>
<head>
    <title>Campus Portal Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e6f0ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background-color: white;
            padding: 30px;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
            text-align: center;
        }

        h2 {
            color: #003366;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid gray;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #003366;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0055aa;
        }

        a {
            text-decoration: none;
            color: blue;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Campus Portal</h2>
        <p>Student Login</p>

        <form>
            <input type="text" placeholder="sahanadsouza2007-ux" required>

            <input type="password" placeholder="Enter Password" required>

            <button type="submit">Login Page</button>
        </form>

        <br>

        <a href="#">Forgot Password?</a>

    </div>

</body>
</html>
